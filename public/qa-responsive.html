<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cheshire isolated responsive review</title><style>body{margin:0;padding:16px 20px;background:#edf0eb;color:#183425;font:14px system-ui}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:15px;margin:0}button{border:1px solid #a2b4a5;background:white;border-radius:8px;min-height:36px;padding:0 12px;color:#183425;cursor:pointer}button[aria-pressed=true]{background:#22402e;color:#faf7f0}#frame-outer{margin:0 auto;position:relative}iframe{display:block;border:0;transform-origin:top left;background:#22402e}p{margin:0;font-size:12px}</style></head><body><header><h1>Final spreadsheet review</h1><button data-width="1440" data-height="900">Desktop 1440</button><button data-width="1266" data-height="757">Desktop 1266</button><button data-width="768" data-height="1024">Tablet 768</button><button data-width="390" data-height="844">Phone 390</button><button data-width="333" data-height="740">Phone 333</button><p id="size"></p></header><div id="frame-outer"><iframe title="Isolated Cheshire candidate" src="/cheshire/dashboard"></iframe></div><script>const frame=document.querySelector('iframe'),outer=document.querySelector('#frame-outer'),buttons=[...document.querySelectorAll('button')];let width=1440,height=900;function size(){const scale=Math.min(1,(window.innerWidth-40)/width);frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';outer.style.width=width*scale+'px';outer.style.height=height*scale+'px';document.querySelector('#size').textContent='Actual iframe: '+width+' × '+height+' CSS px';buttons.forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.width===width)))}buttons.forEach(b=>b.addEventListener('click',()=>{width=+b.dataset.width;height=+b.dataset.height;size()}));window.addEventListener('resize',size);size();</script></body></html>
